[package]
name = "agent_data"
version = "0.1.0"
edition = "2021"
description = "DuckDB extension for reading AI coding agent data (Claude Code, Claude Desktop, GitHub Copilot, Cursor)"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
strip = true

[dependencies]
duckdb = { version = "=1.10505.0", features = ["loadable-extension"] }
libduckdb-sys = "=1.10505.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dirs = "5"

[features]
default = ["cursor"]
# The Cursor parser reads state.vscdb with a self-contained, pure-Rust,
# read-only SQLite reader (src/vscdb.rs) — no external dependency, so it builds
# on every arch (incl. windows_amd64_mingw). The feature only gates that module
# plus the Cursor types; build with `--no-default-features` to drop them.
cursor = []
