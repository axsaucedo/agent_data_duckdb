[package]
name = "agent_data"
version = "0.1.0"
edition = "2021"
description = "DuckDB extension for reading AI coding agent data (Claude Code, Claude Desktop, GitHub Copilot, Cursor)"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
strip = true

[dependencies]
duckdb = { version = "=1.10504.0", features = ["loadable-extension"] }
libduckdb-sys = "=1.10504.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dirs = "5"
# Optional: only needed for the Cursor parser, which reads state.vscdb (SQLite).
# `bundled` statically links SQLite so the extension stays self-contained.
rusqlite = { version = "0.31", features = ["bundled"], optional = true }

[features]
default = ["cursor"]
cursor = ["dep:rusqlite"]
