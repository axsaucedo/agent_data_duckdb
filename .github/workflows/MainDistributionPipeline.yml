#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.4
      ci_tools_version: v1.5-variegata
      extension_name: agent_data
      extra_toolchains: rust
      # windows_amd64_mingw excluded: the Cursor provider pulls in libsqlite3-sys
      # (rusqlite `bundled`), whose sqlite3.c is compiled with mingw gcc and emits
      # libgcc/MSVCRT symbols (__chkstk_ms, _beginthreadex, _localtime64) that the
      # link step cannot resolve on that arch. All other Windows/Linux/macOS archs
      # build and test cleanly; mingw + a bundled-C crate is an unsupportable
      # toolchain mix here.
      exclude_archs: "wasm_mvp;wasm_eh;wasm_threads;linux_amd64_musl;windows_amd64_mingw"
